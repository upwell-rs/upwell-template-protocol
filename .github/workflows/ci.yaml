name: CI

on:
  push:
  pull_request:

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate@0.23.14
      - name: Generate protocol
        run: >-
          cargo generate --path . --destination "$RUNNER_TEMP" --name example-protocol
          --define macro_crate=false --define upwell_version=0.20.0
          --define 'upwell_dependency={ version = "0.20", default-features = false, features = ["tooling"] }'
          --define 'upwell_base_dependency={ version = "0.20", default-features = false }'
          --define 'upwell_app_dependency={ version = "0.20", default-features = false }'
          --define 'upwell_macros_core_dependency={ version = "0.20", default-features = false }'
      - name: Generate protocol with macros
        run: >-
          cargo generate --path . --destination "$RUNNER_TEMP" --name example-protocol-macros
          --define macro_crate=true --define upwell_version=0.20.0
          --define 'upwell_dependency={ version = "0.20", default-features = false, features = ["tooling"] }'
          --define 'upwell_base_dependency={ version = "0.20", default-features = false }'
          --define 'upwell_app_dependency={ version = "0.20", default-features = false }'
          --define 'upwell_macros_core_dependency={ version = "0.20", default-features = false }'
      - run: cargo fmt --all --manifest-path "$RUNNER_TEMP/example-protocol/Cargo.toml" --check
      - run: cargo fmt --all --manifest-path "$RUNNER_TEMP/example-protocol-macros/Cargo.toml" --check
